        // --- STATE APLIKASI ---
        let currentSopId = 'sop1'; // SOP yang aktif saat ini
        let currentView = 'sop'; // Tampilan saat ini ('sop' or 'form')
        let currentFormId = null; // Form yang aktif saat ini

        // --- FIREBASE STATE ---
        let app, auth, db;
        let userId = null;
        let isAuthReady = false;

        // --- Elemen DOM ---
        const sopListEl = document.getElementById('sop-list');
        const mainContentEl = document.getElementById('main-content');

        // --- FUNGSI RENDER ---

        /** Merender daftar SOP di sidebar */
        function renderSidebar() {
            sopListEl.innerHTML = ''; // Kosongkan dulu
            sopData.forEach(sop => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <button 
                        class="sidebar-item w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 transition duration-150 ${sop.id === currentSopId ? 'active' : ''}"
                        onclick="showSopDetail('${sop.id}')"
                    >
                        <strong>${sop.title}</strong>
                        <span class="block text-sm text-gray-500">${sop.role}</span>
                    </button>
                `;
                sopListEl.appendChild(li);
            });
        }

        /** Merender konten utama (SOP detail atau Form) */
        function renderMainContent() {
            if (currentView === 'sop') {
                renderSopDetail();
            } else if (currentView === 'form') {
                renderFormView();
            }
        }

        /** Merender detail SOP yang dipilih */
        function renderSopDetail() {
            const sop = sopData.find(s => s.id === currentSopId);
            if (!sop) return;

            // Membuat daftar langkah
            const langkahList = sop.langkah.map(langkah => 
                `<li class="mb-2 text-gray-700">${langkah}</li>`
            ).join('');

            // Membuat tombol formulir
            const formButtons = sop.forms.map(form => 
                `<button 
                    class="bg-blue-600 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition duration-150"
                    onclick="showForm('${form.id}')"
                >
                    Buka ${form.title}
                </button>`
            ).join('');

            mainContentEl.innerHTML = `
                <div class="card space-y-6 fade-in-content">
                    <!-- Judul -->
                    <h2 class="text-3xl font-bold text-gray-800">${sop.title}</h2>
                    <span class="inline-block bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full">${sop.role}</span>

                    <!-- Tujuan -->
                    <div>
                        <h3 class="text-xl font-semibold mb-2 text-gray-700">Tujuan</h3>
                        <p class="text-gray-700">${sop.tujuan}</p>
                    </div>

                    <!-- Ruang Lingkup -->
                    <div>
                        <h3 class="text-xl font-semibold mb-2 text-gray-700">Ruang Lingkup</h3>
                        <p class="text-gray-700">${sop.ruangLingkup}</p>
                    </div>

                    <!-- Langkah-langkah -->
                    <div>
                        <h3 class="text-xl font-semibold mb-2 text-gray-700">Langkah-langkah</h3>
                        <ol class="list-decimal list-inside space-y-2 pl-4">
                            ${langkahList}
                        </ol>
                    </div>

                    <!-- Flowchart -->
                    <div>
                        <h3 class="text-xl font-semibold mb-2 text-gray-700">Flowchart Sederhana</h3>
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <p class="text-gray-800 font-medium">${sop.flowchart}</p>
                        </div>
                    </div>

                    <!-- Formulir Terkait -->
                    <div>
                        <h3 class="text-xl font-semibold mb-4 text-gray-700">Formulir Terkait</h3>
                        <div class="flex flex-wrap gap-4">
                            ${formButtons}
                        </div>
                    </div>
                </div>
            `;
        }

        /** Merender formulir digital yang dipilih */
        function renderFormView() {
            const formDef = formDefinitions[currentFormId];
            if (!formDef) {
                mainContentEl.innerHTML = `<p>Formulir tidak ditemukan.</p>`;
                return;
            }

            // Membuat field formulir
            const formFields = formDef.fields.map(field => {
                let inputHtml = '';
                const requiredAttr = field.required ? 'required' : '';
                const disabledAttr = field.disabled ? 'disabled' : '';
                const placeholder = field.placeholder ? `placeholder="${field.placeholder}"` : '';
                const value = field.value ? `value="${field.value}"` : '';

                switch (field.type) {
                    case 'textarea':
                        inputHtml = `<textarea id="${field.name}" name="${field.name}" rows="4" class="form-input" ${placeholder} ${requiredAttr}></textarea>`;
                        break;
                    case 'select':
                        const options = field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                        inputHtml = `<select id="${field.name}" name="${field.name}" class="form-input" ${requiredAttr}>
                                        <option value="">-- Pilih --</option>
                                        ${options}
                                     </select>`;
                        break;
                    case 'checkbox':
                        inputHtml = `<input type="checkbox" id="${field.name}" name="${field.name}" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">`;
                        // Sedikit ubah layout untuk checkbox
                        return `<div class="mb-4 flex items-center">
                                    ${inputHtml}
                                    <label for="${field.name}" class="ml-2 block text-sm font-medium text-gray-700">${field.label}</label>
                                </div>`;
                    default: // text, number, date
                        inputHtml = `<input type="${field.type}" id="${field.name}" name="${field.name}" class="form-input" ${placeholder} ${value} ${requiredAttr} ${disabledAttr}>`;
                }

                return `<div class="mb-4">
                            <label for="${field.name}" class="form-label">${field.label} ${field.required ? '<span class="text-red-500">*</span>' : ''}</label>
                            ${inputHtml}
                        </div>`;
            }).join('');

            mainContentEl.innerHTML = `
                <div class="card max-w-2xl mx-auto fade-in-content">
                    <!-- Tombol Kembali -->
                    <button 
                        class="text-blue-600 hover:underline mb-4"
                        onclick="goBackToSop()"
                    >
                        &larr; Kembali ke Detail SOP
                    </button>

                    <!-- Judul Form -->
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">${formDef.title}</h2>

                    <!-- Pesan Sukses (tersembunyi) -->
                    <div id="success-message" class="hidden flex items-center bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                        <!-- Ikon Sukses (Checkmark Circle) -->
                        <svg class="w-5 h-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>
                        <div>
                            <strong class="font-bold">Sukses!</strong>
                            <span class="block sm:inline">Formulir telah berhasil disimpan ke database.</span>
                        </div>
                    </div>

                    <!-- Pesan Error (tersembunyi) -->
                    <div id="error-message" class="hidden flex items-center bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                        <!-- Ikon Error (Alert Triangle) -->
                        <svg class="w-5 h-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                        </svg>
                        <div>
                            <strong class="font-bold">Error!</strong>
                            <span id="error-text" class="block sm:inline">Terjadi kesalahan.</span>
                        </div>
                    </div>

                    <!-- Formulir -->
                    <form id="digital-form" onsubmit="handleFormSubmit(event)">
                        ${formFields}
                        <div class="mt-6">
                            <button type="submit" id="submit-button" class="btn-primary" disabled>
                                <span id="submit-text">Kirim Formulir</span>
                                <span id="submit-loading" class="hidden">Menyimpan...</span>
                            </button>
                            <p id="auth-status" class="text-sm text-gray-500 mt-2">Menghubungkan ke database...</p>
                        </div>
                    </form>
                </div>
            `;
            
            // Update status tombol setelah render
            updateFormButtonStatus();
        }

        /** Memperbarui status tombol submit berdasarkan status auth Firebase */
        function updateFormButtonStatus() {
            const submitButton = document.getElementById('submit-button');
            const authStatus = document.getElementById('auth-status');
            
            if (submitButton && authStatus) {
                if (isAuthReady) {
                    submitButton.disabled = false;
                    authStatus.classList.add('hidden');
                } else {
                    submitButton.disabled = true;
                    authStatus.classList.remove('hidden');
                }
            }
        }


        // --- FUNGSI EVENT HANDLER ---

        /** Pindah ke tampilan detail SOP */
        function showSopDetail(sopId) {
            currentSopId = sopId;
            currentView = 'sop';
            currentFormId = null;
            renderSidebar(); // Update highlight
            renderMainContent();
            window.scrollTo(0, 0); // Scroll ke atas
        }

        /** Pindah ke tampilan formulir */
        function showForm(formId) {
            currentFormId = formId;
            currentView = 'form';
            renderMainContent();
            window.scrollTo(0, 0); // Scroll ke atas
        }

        /** Kembali ke tampilan detail SOP dari formulir */
        function goBackToSop() {
            currentView = 'sop';
            currentFormId = null;
            renderMainContent();
            window.scrollTo(0, 0); // Scroll ke atas
        }

        /** Menangani submit formulir (simulasi) */
        async function handleFormSubmit(event) {
            event.preventDefault(); // Mencegah reload halaman
            
            const submitButton = document.getElementById('submit-button');
            const submitText = document.getElementById('submit-text');
            const submitLoading = document.getElementById('submit-loading');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // --- Cek Auth ---
            if (!isAuthReady || !db || !userId) {
                errorText.textContent = "Koneksi database belum siap. Silakan coba lagi sesaat.";
                errorMessage.classList.remove('hidden');
                return;
            }

            // --- Set Loading State ---
            submitButton.disabled = true;
            submitText.classList.add('hidden');
            submitLoading.classList.remove('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');

            try {
                const formData = new FormData(event.target);
                // Kita perlu cara khusus untuk menangani checkbox
                // karena formData tidak menyertakan checkbox yang tidak dicentang
                const data = {};
                formDefinitions[currentFormId].fields.forEach(field => {
                    if (field.type === 'checkbox') {
                        // Simpan sebagai boolean
                        data[field.name] = formData.get(field.name) ? true : false;
                    } else {
                        data[field.name] = formData.get(field.name);
                    }
                });

                // Tambahkan metadata
                const submissionData = {
                    ...data,
                    formId: currentFormId,
                    formTitle: formDefinitions[currentFormId].title,
                    submittedAt: new Date().toISOString(),
                    submittedByUserId: userId
                };
                
                // Tentukan path koleksi berdasarkan aturan:
                // /artifacts/{appId}/users/{userId}/{collection_name}
                // Kita gunakan formId sebagai collection_name
                const collectionPath = `artifacts/${appId}/users/${userId}/${currentFormId}`;
                
                // Simpan ke Firestore
                const docRef = await addDoc(collection(db, collectionPath), submissionData);

                // --- Handle Success ---
                console.log('--- FORM SUBMITTED to Firestore ---');
                console.log('Form:', formDefinitions[currentFormId].title);
                console.log('Data:', submissionData);
                console.log('Document ID:', docRef.id);
                
                successMessage.classList.remove('hidden');
                event.target.reset(); // Reset form

                // Sembunyikan pesan sukses setelah 3 detik
                setTimeout(() => {
                    successMessage.classList.add('hidden');
                }, 3000);

            } catch (error) {
                // --- Handle Error ---
                console.error("Error submitting to Firestore:", error);
                errorText.textContent = `Gagal menyimpan data: ${error.message}`;
                errorMessage.classList.remove('hidden');
            
            } finally {
                // --- Reset Loading State ---
                submitButton.disabled = false;
                submitText.classList.remove('hidden');
                submitLoading.classList.add('hidden');
            }
        }

        // --- INISIALISASI ---

        /** Inisialisasi Firebase */
        async function initializeAppFirebase() {
            try {
                if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                    throw new Error("Konfigurasi Firebase tidak ditemukan.");
                }
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                setLogLevel('Debug'); // Aktifkan log debug Firestore

                // Pantau status autentikasi
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        // Pengguna sudah sign-in
                        userId = user.uid;
                    } else {
                        // Belum ada pengguna, coba sign-in
                        try {
                            if (initialAuthToken) {
                                // Gunakan token kustom jika ada
                                await signInWithCustomToken(auth, initialAuthToken);
                            } else {
                                // Fallback ke sign-in anonim
                                await signInAnonymously(auth);
                            }
                            userId = auth.currentUser?.uid || crypto.randomUUID();
                        } catch (authError) {
                            console.error("Firebase Auth sign-in failed:", authError);
                            throw new Error("Gagal melakukan autentikasi.");
                        }
                    }
                    
                    isAuthReady = true;
                    console.log('Firebase Auth Ready. UserID:', userId);
                    
                    // Jika kita sedang di halaman form, update tombolnya
                    if (currentView === 'form') {
                        updateFormButtonStatus();
                    }
                });
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                // Tampilkan error ke pengguna di main content
                mainContentEl.innerHTML = `
                    <div class="card bg-red-100 border border-red-400 text-red-700 p-4 rounded-lg">
                        <strong class="font-bold">Error Kritis:</strong>
                        <span class="block">${error.message} Gagal terhubung ke database. Silakan refresh halaman.</span>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderMainContent();
            initializeAppFirebase(); // Mulai koneksi Firebase saat DOM siap
        });

        // --- Attach handlers to window ---
        // Ini diperlukan karena kita menggunakan <script type="module">
        // dan onclick="" di HTML butuh akses ke fungsi global.
        window.showSopDetail = showSopDetail;
        window.showForm = showForm;
        window.goBackToSop = goBackToSop;
        window.handleFormSubmit = handleFormSubmit;

    </script>
</body>
</html>
